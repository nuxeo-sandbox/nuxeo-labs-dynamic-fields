<!--
`nuxeo-customschemadef-view-layout`
@group Nuxeo UI
@element nuxeo-customschemadef-view-layout
-->
<dom-module id="nuxeo-customschemadef-view-layout">
  <template>
    <style include="nuxeo-styles">
      nuxeo-data-table {
        height: 400px;
      }
    </style>

    <nuxeo-card>

      <nuxeo-input
        role="widget"
        label="[[i18n('dynamicFields.customSchemaDef.customerId')]]"
        name="customerId"
        value="[[document.properties.csd:customerId]]"
        readonly
      ></nuxeo-input>

      <nuxeo-input
        role="widget"
        label="[[i18n('dynamicFields.customSchemaDef.defForTyp')]]"
        name="defForTyp"
        value="[[document.properties.csd:defForTyp]]"
        readonly
      ></nuxeo-input>

      <nuxeo-data-table
        role="widget"
        label="[[i18n('dynamicFields.customSchemaDef.definition')]]"
        items="[[document.properties.csd:definition]]"
        name="definition"
      >
        <nuxeo-data-table-column name="[[i18n('dynamicFields.customSchemaDef.fieldName')]]">
          <template>[[item.fieldName]]</template>
        </nuxeo-data-table-column>

        <nuxeo-data-table-column name="[[i18n('dynamicFields.customSchemaDef.fieldTyp')]]">
          <template>
            <nuxeo-directory-suggestion role="widget" value="[[item.fieldTyp]]" label="" readonly="true" directory-name="dynf_field_types" name="fieldTyp"></nuxeo-directory-suggestion>
          </template>
        </nuxeo-data-table-column>
      </nuxeo-data-table>

      </nuxeo-card>

  </template>

  <script>
    Polymer({
      is: 'nuxeo-customschemadef-view-layout',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {
        /**
         * @doctype CustomSchemaDef
         */
        document: {
          type: Object,
        },
      },
    });
  </script>
</dom-module>
