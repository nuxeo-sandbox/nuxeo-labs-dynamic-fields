<!--
`nuxeo-customschemadefcontainer-edit-layout`
@group Nuxeo UI
@element nuxeo-customschemadefcontainer-edit-layout
-->
<dom-module id="nuxeo-customschemadefcontainer-edit-layout">
  <template>
    <style include="nuxeo-styles">
      .inputclass {
        margin-bottom: 12px;
      }
    </style>
    <div class="inputclass">
      <nuxeo-input
        role="widget"
        label="[[i18n('title')]]"
        name="title"
        value="{{document.properties.dc:title}}"
        autofocus
        required
        id="inputElem"
        error-message="[[i18n('title.err')]]"
        on-value-changed="_validateOnChange"
      >
      </nuxeo-input>
    </div>
    <nuxeo-textarea
      role="widget"
      label="[[i18n('label.description')]]"
      name="description"
      value="{{document.properties.dc:description}}"
    >
    </nuxeo-textarea>

    <nuxeo-date-picker
      role="widget"
      label="[[i18n('label.dublincore.expire')]]"
      name="expired"
      value="{{document.properties.dc:expired}}"
      aria-label$="[[i18n('label.dublincore.expire')]]"
    >
    </nuxeo-date-picker>
  </template>

  <script>
    Polymer({
      is: 'nuxeo-customschemadefcontainer-edit-layout',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {
        /**
         * @doctype CustomSchemaDefContainer
         */
        document: Object,
      },
      validate() {
        return this.$.inputElem.validate();
      },

      _validateOnChange() {
        this.$.inputElem.validate();
      },
    });
  </script>
</dom-module>
